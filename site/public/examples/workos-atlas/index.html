<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>workos.com/atlas “Connected to all your tools”, rebuilt with motion-clone</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./src/atlas.css">
  <script type="module" src="./src/atlas.js"></script>
</head>
<body>
  <main class="page">
    <div class="atlas-tools" role="img" aria-label="Atlas reaching out from its antenna to a dome of more than 150 services — Google Drive, GitHub, Notion, Salesforce, Linear, Jira, Gmail, Stripe and more — connecting to a few at a time and bringing the answers back.">
      <div class="atlas-tools__content" aria-hidden="true">
        <div class="atlas-tools__stage">

          <div class="atlas-tools__botLayer" style="left:100px;top:200px;--bot-size:336px;--bot-clip:0px">
            <div class="atlas-tools__bot" style="width:336px">
              <img alt="Atlas Robot" draggable="false" loading="lazy" width="336" height="336" decoding="async"
                srcset="./assets/img/bot-384.webp 1x, ./assets/img/bot-750.webp 2x" src="./assets/img/bot-750.webp">
              <div class="atlas-tools__facePlate">
                <div class="atlas-tools__faceFade">
                  <div class="bot-face" aria-hidden="true">
                    <div class="bot-face-gradient" style="background:radial-gradient(ellipse 92% 88% at 50% 60%, #117AAE 0%, #003B90 40%, #002555 72%, transparent 100%);opacity:0.8"></div>
                    <div class="bot-eye-slot">
                      <div class="bot-eye-track">
                        <div class="bot-eye">
                          <div class="bot-eye-glow"></div>
                          <div class="bot-eye-core"><div class="bot-eye-core-body"></div><div class="bot-eye-core-pupil"></div></div>
                        </div>
                      </div>
                    </div>
                    <div class="bot-eye-slot">
                      <div class="bot-eye-track">
                        <div class="bot-eye">
                          <div class="bot-eye-glow"></div>
                          <div class="bot-eye-core"><div class="bot-eye-core-body"></div><div class="bot-eye-core-pupil"></div></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <img class="atlas-tools__faceShadow" alt="" draggable="false" loading="lazy" width="336" height="336" decoding="async"
                srcset="./assets/img/bot-face-shadow-384.webp 1x, ./assets/img/bot-face-shadow-750.webp 2x" src="./assets/img/bot-face-shadow-750.webp">
            </div>
            <div class="atlas-tools__glare" aria-hidden="true" style="opacity:0"></div>
            <div class="atlas-tools__glareStreak" aria-hidden="true" style="opacity:0"></div>
          </div>

          <div class="atlas-tools__laptop" aria-hidden="true" style="left:138.504px;bottom:-16px;--lid-scale:0.65">
            <div class="atlas-tools__macbook">
              <div class="atlas-tools__shadowLayer">
                <div class="atlas-tools__groundShadow" style="opacity:0.62;transform:scale(0.84, 0.9)"></div>
              </div>
              <div class="atlas-tools__lid" style="transform:rotateX(60deg)">
                <div class="atlas-tools__lidBack">
                  <svg class="atlas-tools__emblem" viewBox="0 0 23 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M0 13.9997C0 14.4385 0.115482 14.8774 0.338749 15.2546L4.38833 22.2682C4.80407 22.9842 5.43537 23.5693 6.22065 23.8311C7.76812 24.3469 9.36948 23.6848 10.1317 22.3606L11.1094 20.6669L7.2523 13.9997L11.325 6.93986L12.3027 5.24612C12.5953 4.738 12.9879 4.32226 13.4499 3.99121H13.0264H7.16761C6.06668 3.99121 5.05043 4.57632 4.50382 5.53098L0.338749 12.7448C0.115482 13.122 0 13.5609 0 13.9997Z" fill="currentColor"/>
                    <path d="M23.0963 13.9996C23.0963 13.5608 22.9809 13.122 22.7576 12.7447L18.6541 5.63872C17.8919 4.32222 16.2906 3.66012 14.7431 4.16824C13.9578 4.43 13.3265 5.01511 12.9108 5.7311L11.9869 7.32476L15.844 13.9996L11.7714 21.0595L10.7936 22.7532C10.5011 23.2536 10.1084 23.6771 9.64648 24.0081H10.0699H15.9287C17.0297 24.0081 18.0459 23.423 18.5925 22.4684L22.7576 15.2546C22.9809 14.8773 23.0963 14.4385 23.0963 13.9996Z" fill="currentColor"/>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <!-- generated by src/atlas.js: the field below the chips (lines, halos), 38 chips, the field above (rings, ripples) -->
        </div>
      </div>
    </div>
  </main>
</body>
</html>
