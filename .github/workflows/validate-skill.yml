name: Validate Reanimate skill
on:
  push:
    paths:
      - "skills/reanimate/**"
      - ".github/workflows/validate-skill.yml"
  pull_request:
    paths:
      - "skills/reanimate/**"
      - ".github/workflows/validate-skill.yml"
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/reanimate/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: bunx --no-install playwright install --with-deps chromium
      - run: bun setup.ts
      - run: bun test
